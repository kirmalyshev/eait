name: Bug
description: Something the server or the contract does that it should not.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: The request, the response, and what you expected instead. Redact tokens and personal data.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Against `bun run demo` if at all possible — it needs no database and no key.
      placeholder: |
        1. bun run demo
        2. curl -X POST localhost:8787/v1/auth/device -d '{"deviceId":"…"}'
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD`, or the date if against api.eait.fit."
  - type: checkboxes
    id: rules
    attributes:
      label: Checked
      options:
        - label: I read the `AGENTS.md` for the workspace this touches and this is not documented, intended behaviour.
          required: true
