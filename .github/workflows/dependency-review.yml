name: dependency-review

# Refuses a PR that adds a dependency with a known vulnerability or a license outside the allow
# list. Free on public repositories, paid on private — gated on visibility like codeql.yml.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, CC0-1.0, Unlicense, BlueOak-1.0.0, MPL-2.0, AGPL-3.0-only, AGPL-3.0-or-later, Python-2.0
