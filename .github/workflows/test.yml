name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eait
          POSTGRES_PASSWORD: eait
          POSTGRES_DB: eait__test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eait -d eait__test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The store contract suite runs against BOTH implementations when this is set, and skips
      # Postgres loudly when it is not.
      #
      # `eait__test` is slot 0's TEST database — the same name `src/scripts/dev-env.ts` derives for a
      # single checkout, so CI runs against the database the docs name rather than one only this file
      # knows. The double underscore is the same rule it is everywhere else: a branch name cannot
      # produce one, so no branch's dev database can ever be another branch's test database. Here
      # there is one ephemeral server and nothing to collide with, and that is exactly why the name
      # must not be allowed to drift — a reader who copies it back onto a development machine gets
      # the collision this repo removed.
      # `eait_app`, not `eait`. The service container's POSTGRES_USER is a SUPERUSER, and a
      # superuser bypasses row-level security whatever the policy says — the contract suite's first
      # RLS assertion is that it is NOT connected as one, precisely so a green run here cannot mean
      # "nothing was ever asked". The step below creates the role, with the script production uses.
      TEST_DATABASE_URL: postgres://eait_app:eait@127.0.0.1:5432/eait__test
      # The SUPERUSER url, for `db-init.contract.test.ts` alone — it creates a database of its own,
      # builds the whole schema in it AS THIS ROLE, and drops it again.
      #
      # THE STEP BELOW CANNOT PROVE THE HAND-OVER, AND THAT IS WHY THIS EXISTS. It runs before
      # `bun run check`, so `migrate()` has created nothing yet and the script's three ownership
      # loops match zero rows every run; everything the suite then touches was made by `eait_app` in
      # the first place. The case the script is FOR — a deployed database full of objects the
      # superuser created — had never run anywhere a test looked.
      TEST_SUPERUSER_DATABASE_URL: postgres://eait:eait@127.0.0.1:5432/eait__test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun audit
      # THE SAME SCRIPT THE DEPLOY RUNS, against the service container instead of compose's `db`.
      # A second implementation here would be a second thing to keep true, and the one that drifts
      # is always the one nobody looks at.
      - name: The role the policies apply to
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGPASSWORD: eait
          POSTGRES_USER: eait
          POSTGRES_DB: eait__test
          EAIT__DEPLOY__APP_DB_PASSWORD: eait
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          sh src/iac/db-init.sh
      - run: bun run check

  web:
    name: The browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `playwright.config.ts` leaves the specs that reach a real provider (`@model`) out of every
      # run but `real`, so nothing here is billed.
      EAIT_WEB_E2E_LLM: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      # `channel: "chrome"` drives the Google Chrome the runner image already ships; no download.
      - run: bun run web:e2e
      - name: Evidence, when something failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-evidence
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
