name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eait
          POSTGRES_PASSWORD: eait
          POSTGRES_DB: eait_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eait -d eait_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The store contract suite runs against BOTH implementations when this is set, and skips
      # Postgres loudly when it is not.
      TEST_DATABASE_URL: postgres://eait:eait@127.0.0.1:5432/eait_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run check

  web:
    name: The browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `playwright.config.ts` leaves the specs that reach a real provider (`@model`) out of every
      # run but `real`, so nothing here is billed.
      EAIT_WEB_E2E_LLM: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      # `channel: "chrome"` drives the Google Chrome the runner image already ships; no download.
      - run: bun run web:e2e
      - name: Evidence, when something failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-evidence
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
