name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC — catches newly-disclosed dep vulns
  workflow_dispatch:

permissions:
  contents: read # least privilege
  # gitleaks-action v3 lists the PR's commits to scope the scan; without this it gets a
  # 403 and the job dies mid-run, which looks like a finding but means nothing was scanned.
  pull-requests: read

jobs:
  # ONE job on ONE machine. Checkout, bun and the Postgres service are set up once and shared by
  # every check, instead of paying a second runner's startup for a 3s secret scan.
  #
  # Ordering is deliberate: the two checks that can FAIL THE MERGE FOR SECURITY REASONS run first,
  # so a broken test can never hide a leaked secret behind an early exit. Everything after them
  # carries `if: always()`, so one failure still reports every other result in the same run —
  # keeping the independent-signal property the two-job layout used to give for free.
  verify:
    runs-on: ubuntu-latest
    services:
      # The test suite runs one throwaway database per test against a real Postgres.
      # Host port 5439 matches the suite's PGPORT default, so no env wiring is needed.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eait
          POSTGRES_PASSWORD: eait
          POSTGRES_DB: eait
          # Every test opens its own throwaway database and holds one connection until the
          # file's afterAll — bot.test.ts alone exceeds the stock 100. Must match the 300 in
          # docker-compose.infra.yml, or CI fails on connection exhaustion where local passes.
          # (Service containers can't override the command; initdb -c persists the setting.)
          POSTGRES_INITDB_ARGS: "-c max_connections=300"
        ports:
          - "5439:5432"
        options: >-
          --health-cmd "pg_isready -U eait -d eait"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # --- security gates first: a failure below must never hide one of these ---
      - name: Repo safety scan (secrets + personal-data guardrails)
        # Personal patterns are not in the repo (they would leak what they guard). Supplied
        # here as a secret; absent on fork PRs, where the personal rules simply do not run.
        env:
          SECURITY_PERSONAL_PATTERNS: ${{ secrets.SECURITY_PERSONAL_PATTERNS }}
        run: bun run security
      - name: gitleaks (secret history scan)
        uses: gitleaks/gitleaks-action@v3
        env:
          # v3 refuses to scan a pull_request event without this and exits before scanning
          # anything — the job fails in a way that looks like a finding but is a missing token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      # --- correctness gates: each reports even if an earlier one failed ---
      - name: Typecheck
        if: always()
        # `bun test` strips types, so nothing here enforced tsc until now. Several invariants are
        # carried ONLY by the type system — the required `restrictions` parameter on the meal
        # renderers (omitting it would silently mean "show everything"), and the `satisfies` guards
        # that make a new verdict dimension a compile error rather than a silently missing row.
        run: bun run typecheck
      - name: Tests
        if: always()
        run: bun test
      - name: Dependency audit (informational)
        if: always()
        run: bun audit --audit-level=high || true
      # setup.sh is the self-hoster entrypoint and runs on machines we never see;
      # a portability bug there is a broken first impression with no stack trace.
      - name: Shell script lint
        if: always()
        # shellcheck ships on the ubuntu-latest runner image; apt-get here cost 8s per run to
        # reinstall it. Install only as a fallback, so this keeps working if the image drops it.
        run: |
          command -v shellcheck >/dev/null 2>&1 \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck -s sh scripts/*.sh .githooks/*
